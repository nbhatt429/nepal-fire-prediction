name: Daily Fire Prediction

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC = 7:45 AM Nepal time
  workflow_dispatch:      # manual trigger

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install xgboost joblib numpy pandas scipy matplotlib                       openmeteo-requests requests-cache retry-requests

      - name: Run prediction
        run: python predict.py

      - name: Commit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add fire_risk_*.csv fire_risk_map_*.png
          git diff --staged --quiet || git commit -m "Daily forecast $(date +%Y-%m-%d)"
          git push
